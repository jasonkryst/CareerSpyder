[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "careerspyder"
version = "0.17.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "apscheduler>=3.11.3",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "playwright>=1.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.16.2",
    "mypy>=2.3.0",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"app.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["S"]  # flake8-bandit security rules

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]  # asserts + fixture creds/paths are fine in tests
# Every dynamic query here interpolates only allow-listed column names/ORDER
# direction (never user-supplied values) alongside `?` placeholders for
# actual data -- see _run_filters_sql/_job_filters_sql and the *_SORT_COLUMNS
# dicts. S608 can't tell allow-listed identifiers from unsanitized input.
"app/db.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
files = ["app"]

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true
