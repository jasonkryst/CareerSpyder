[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "careerspyder"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "apscheduler>=3.11.3",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "playwright>=1.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.16.2",
    "mypy>=2.3.0",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"app.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["app"]

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true
