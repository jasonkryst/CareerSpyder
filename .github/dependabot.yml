version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    # "/" only covers .github/workflows; the glob also keeps action pins
    # inside local composite actions (.github/actions/*) up to date.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Python 3.15 base image: PyYAML (via uvicorn[standard]) has no 3.15
      # wheels yet and the slim image has no compiler, so the build fails;
      # CI also tests on 3.14 (tests/test_ci_workflows.py keeps them in
      # step). Drop this when moving Docker + CI to 3.15 together (#277).
      - dependency-name: "python"
        versions: [">=3.15"]
