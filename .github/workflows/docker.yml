name: Docker

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build-scan-smoketest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker compose build

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: careerspyder:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          exit-code: "1"
          format: table

      - name: Start container
        run: |
          mkdir -p config data
          echo '{"sources": []}' > config/sources.json
          cat > .env <<'EOF'
          SMTP_PASSWORD=ci-placeholder
          SMTP_HOST=localhost
          SMTP_PORT=587
          SMTP_USER=ci
          EMAIL_FROM=ci@example.test
          EMAIL_TO=ci@example.test
          RUN_HOUR=8
          TZ=UTC
          EOF
          docker compose up -d

      - name: Wait for app to respond
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "App never became ready" >&2
          docker compose logs
          exit 1

      - name: Smoke test all pages
        run: |
          for path in / /sources /history /settings; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080$path")
            if [ "$status" != "200" ]; then
              echo "GET $path returned $status, expected 200" >&2
              docker compose logs
              exit 1
            fi
            echo "GET $path -> 200"
          done

      - name: Read version from pyproject.toml
        if: github.event_name == 'push'
        id: version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image to Docker Hub
        if: github.event_name == 'push'
        run: |
          image="${{ secrets.DOCKERHUB_USERNAME }}/careerspyder"
          version="${{ steps.version.outputs.version }}"
          docker tag careerspyder:latest "$image:latest"
          docker tag careerspyder:latest "$image:$version"
          docker push "$image:latest"
          docker push "$image:$version"

      - name: Tear down
        if: always()
        run: docker compose down
