name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: careerspyder_test
          POSTGRES_USER: careerspyder
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://careerspyder:test@localhost:5432/careerspyder_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: playwright install --with-deps chromium
      - run: pytest -q --cov=app --cov-report=term-missing

  integration-test:
    runs-on: ubuntu-latest
    # Runs even when unit tests fail so live-site regressions are always visible.
    # The job skips silently if the required secrets are not configured — this
    # keeps fork PRs and repos without secrets green without any special logic.
    # To add the URLs: Settings → Secrets and variables → Actions → New secret:
    #   INFOR_TEST_URL_RUMC            (e.g. https://rush.hirequest.com/careers/...)
    #   INFOR_TEST_URL_RUSH_OAK_PARK   (e.g. https://...)
    env:
      INFOR_TEST_URL_RUMC: ${{ secrets.INFOR_TEST_URL_RUMC }}
      INFOR_TEST_URL_RUSH_OAK_PARK: ${{ secrets.INFOR_TEST_URL_RUSH_OAK_PARK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: playwright install --with-deps chromium
      - run: pytest -m integration -v

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: pip-audit

  trivy-fs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan filesystem for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          format: sarif
          output: trivy-fs.sarif

      - name: Upload filesystem scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
