<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — CareerSpyder</title>
  <meta name="theme-color" content="#b3101f">
  <link rel="icon" href="/static/icons/favicon-32.png">
  <script>
    (function () {
      var stored = localStorage.getItem("theme");
      if (stored === "dark" || stored === "light") {
        document.documentElement.setAttribute("data-theme", stored);
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css?v={{ app_version }}">
  <script src="/static/theme.js?v={{ app_version }}" defer></script>
  <style>
    .auth-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      padding: 2rem 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-elevated, #f6f6f7);
      border: 1px solid var(--border, #dcdcde);
      border-radius: 8px;
      padding: 2rem;
    }
    .auth-brand {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--accent, #b3101f);
    }
    .auth-card h1 {
      font-size: 1.2rem;
      margin: 0 0 1.25rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: .875rem;
      margin-bottom: .25rem;
    }
    .form-group input {
      width: 100%;
      box-sizing: border-box;
    }
    .btn-primary {
      width: 100%;
      margin-top: .5rem;
    }
    .auth-error {
      background: var(--error-bg, #fdeceb);
      color: var(--error-fg, #7a1810);
      border: 1px solid var(--border, #dcdcde);
      border-radius: 4px;
      padding: .625rem .75rem;
      font-size: .875rem;
      margin-bottom: 1rem;
    }
    .auth-success {
      background: var(--success-bg, #f2f2f3);
      color: var(--success-fg, #171717);
      border: 1px solid var(--border, #dcdcde);
      border-radius: 4px;
      padding: .625rem .75rem;
      font-size: .875rem;
      margin-bottom: 1rem;
    }
    .auth-help { margin-top: 1rem; font-size: .875rem; text-align: center; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="9" r="5"></circle>
          <line x1="13" y1="13" x2="20" y2="20"></line>
        </svg>
        CareerSpyder
      </div>
      <h1>Sign in</h1>
      {% if error %}
      <div class="auth-error" role="alert">{{ error }}</div>
      {% endif %}
      {% if request.query_params.get("flash") %}
      <div class="{% if request.query_params.get('flash_category') == 'error' %}auth-error{% else %}auth-success{% endif %}"
           role="{% if request.query_params.get('flash_category') == 'error' %}alert{% else %}status{% endif %}">
        {{ request.query_params.get("flash") }}
      </div>
      {% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next or '/' }}">
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username"
                 autofocus required value="{{ username or '' }}">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Sign in</button>
        <p class="auth-help"><a href="/account-recovery">Forgot username or password?</a></p>
      </form>
    </div>
  </div>
</body>
</html>
