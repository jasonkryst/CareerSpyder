services:
  postgres:
    image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    restart: unless-stopped
    environment:
      POSTGRES_DB: careerspyder
      POSTGRES_USER: careerspyder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - careerspyder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerspyder"]
      interval: 5s
      timeout: 3s
      retries: 5

  careerspyder:
    image: jasonkryst/careerspyder:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "32600:8080"
    environment:
      DATABASE_URL: postgresql://careerspyder:${POSTGRES_PASSWORD}@postgres:5432/careerspyder
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
      RUN_CRON: ${RUN_CRON:-0 7 * * *}
      TZ: ${TZ:-UTC}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      CHROMIUM_SANDBOX: ${CHROMIUM_SANDBOX:-}

volumes:
  careerspyder_pgdata:
