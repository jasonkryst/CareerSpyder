services:
  careerspyder:
    image: jasonkryst/careerspyder:latest
    restart: unless-stopped
    ports:
      - "32600:8080"
    environment:
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
      RUN_CRON: ${RUN_CRON:-0 7 * * *}
      TZ: ${TZ:-UTC}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      CAREERSPYDER_DB_PATH: /app/data/state.db
      CAREERSPYDER_SOURCES_PATH: /app/config/sources.json
    volumes:
      - careerspyder_config:/app/config
      - careerspyder_data:/app/data

volumes:
  careerspyder_config:
  careerspyder_data:
